<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-hide {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-reveal {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--tg-theme-hint-color, #666);
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #2a2a2a);
            border-radius: 8px;
            color: var(--tg-theme-text-color, #fff);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕵️ Secret Bot</h1>
        
        <button class="btn btn-hide" onclick="showHide()">🔒 Спрятать текст</button>
        <button class="btn btn-reveal" onclick="showReveal()">🔓 Расшифровать</button>
        
        <div id="hideForm" class="hidden">
            <div class="input-group">
                <label>📎 Выбери картинку (PNG):</label>
                <input type="file" id="imageFile" accept="image/png">
            </div>
            <div class="input-group">
                <label>✍️ Секретный текст:</label>
                <textarea id="secretText" placeholder="Введи текст..."></textarea>
            </div>
            <button class="btn btn-hide" onclick="sendHide()">Отправить боту</button>
        </div>
        
        <div id="revealForm" class="hidden">
            <div class="input-group">
                <label>📎 Выбери шпионскую картинку:</label>
                <input type="file" id="revealFile" accept="image/png">
            </div>
            <button class="btn btn-reveal" onclick="sendReveal()">Расшифровать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        function showHide() {
            document.getElementById('hideForm').classList.remove('hidden');
            document.getElementById('revealForm').classList.add('hidden');
        }
        
        function showReveal() {
            document.getElementById('revealForm').classList.remove('hidden');
            document.getElementById('hideForm').classList.add('hidden');
        }
        
        function sendHide() {
            const file = document.getElementById('imageFile').files[0];
            const text = document.getElementById('secretText').value;
            
            if (!file || !text) {
                tg.showAlert('Заполни все поля!');
                return;
            }
            
            const data = JSON.stringify({
                action: 'hide',
                text: text,
                fileName: file.name
            });
            
            tg.sendData(data);
        }
        
        function sendReveal() {
            const file = document.getElementById('revealFile').files[0];
            
            if (!file) {
                tg.showAlert('Выбери картинку!');
                return;
            }
            
            const data = JSON.stringify({
                action: 'reveal',
                fileName: file.name
            });
            
            tg.sendData(data);
        }
    </script>
</body>
</html>
